name: fivekmrun_flutter
description: A mobile application for 5kmRun.bg.

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 3.18.0+474

environment:
  sdk: ">=3.8.0 <4.0.0"

publish_to: none
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.3

  provider: ^6.0.5

  http: ^0.13.0

  collection: ^1.14.11

  shared_preferences: ^2.3.2

  community_charts_flutter: ^1.0.1
  colorful_safe_area: ^1.0.0

  # Pinned by flutter_localizations from the Flutter SDK — must match its
  # intl constraint or version solving fails.
  intl: ^0.20.2

  strava_client: ^2.3.1

  barcode_widgets: ^2.0.0

  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.3
  firebase_messaging: ^15.1.3
  firebase_crashlytics: ^4.3.10
  scrollable_positioned_list: ^0.3.8
  url_launcher: ^6.3.2
  transparent_image: ^2.0.0
  rate_my_app: ^2.0.0
  after_layout: ^1.0.7+2
  progress_state_button: ^1.0.3
  geocoding: ^3.0.0
  file: ^7.0.1
  uuid: ^4.1.0
  add_to_google_wallet: ^0.0.5
  flutter_shake_animated: ^0.0.5
  path_provider: ^2.1.2
  share_plus: ^13.0.0
  firebase_remote_config: ^5.0.0
  wakelock_plus: ^1.2.0
  screen_brightness: ^1.0.1
  app_badge_plus: ^1.2.3
  mobile_scanner: ^7.1.3
  audioplayers: ^6.6.0
  package_info_plus: ^10.1.0

  flutter_localizations:
    sdk: flutter

# Load-bearing override: add_to_google_wallet -> flutter_svg (>=2.0.10) pulls in
# http ^1.0.0, but the app is still on the http 0.13.x API. This pins http to
# 0.13.x so resolution succeeds. Remove only as part of an http 1.x migration.
# (The previous url_launcher/shared_preferences/intl/cupertino_icons/
# plugin_platform_interface overrides were dropped in 2026 — they only duplicated
# the top-level constraints and changed nothing in resolution.)
dependency_overrides:
  http: ^0.13.0
  # strava_client 2.3.1 requires app_links ^7.1.1, but that floor bumps the
  # SDK requirement to >=3.12.0 — one Dart minor ahead of what this Flutter
  # version (3.38.3 / Dart 3.10.1) ships. 7.0.0 satisfies strava_client's
  # actual API usage (deep-link URI stream) and only needs Dart >=3.10.0.
  # Remove this override once the Flutter/Dart floor moves past 3.12 (#222).
  app_links: ">=7.0.0 <7.1.0"

dev_dependencies:
  flutter_lints: ^2.0.3
  build_runner: ^2.4.6
  flutter_test:
    sdk: flutter
  golden_toolkit: ^0.15.0
  mockito: ^5.4.2
  network_image_mock: ^2.1.1
  #flutter_launcher_icons: "^0.7.3"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  fonts:
    - family: MyFlutterApp
      fonts:
        - asset: fonts/MyFlutterApp.ttf
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  # The following line enables automatic generation of localization files
  generate: true

  assets:
    - assets/

# Generate new app icons command: flutter pub run flutter_launcher_icons:main
flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
