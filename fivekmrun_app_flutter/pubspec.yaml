name: fivekmrun_flutter
description: A mobile application for 5kmRun.bg.

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 3.19.0+477

environment:
  sdk: ^3.12.0

publish_to: none
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.9

  provider: ^6.0.5

  http: ^1.6.0

  collection: ^1.14.11

  shared_preferences: ^2.3.2

  community_charts_flutter: ^1.0.1
  colorful_safe_area: ^1.0.0

  # Pinned by flutter_localizations from the Flutter SDK — must match its
  # intl constraint or version solving fails.
  intl: ^0.20.2

  strava_client: ^2.3.1

  barcode_widgets: ^2.0.0

  firebase_core: ^4.14.0
  firebase_analytics: ^12.5.0
  firebase_messaging: ^16.6.0
  firebase_crashlytics: ^5.3.0
  scrollable_positioned_list: ^0.3.8
  url_launcher: ^6.3.2
  transparent_image: ^2.0.0
  rate_my_app: ^2.4.1
  after_layout: ^1.0.7+2
  progress_state_button: ^1.0.3
  geocoding: ^5.0.0
  file: ^7.0.1
  uuid: ^4.6.0
  add_to_google_wallet: ^0.0.5
  flutter_shake_animated: ^0.0.5
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  firebase_remote_config: ^6.6.0
  wakelock_plus: ^1.7.0
  screen_brightness: ^2.1.5
  app_badge_plus: ^1.3.4
  mobile_scanner: ^7.4.0
  audioplayers: ^6.8.1
  package_info_plus: ^10.2.1

  flutter_localizations:
    sdk: flutter


dev_dependencies:
  flutter_lints: ^6.0.0
  # Test-only: lets a test swap in a slow-write store so the awaited write in
  # LocalStorageResource.setLastSeenWhatsNewVersion is actually pinned.
  # Already present transitively at this exact version.
  shared_preferences_platform_interface: ^2.4.2
  build_runner: ^2.16.0
  flutter_test:
    sdk: flutter
  golden_toolkit: ^0.15.0
  mockito: ^5.8.1
  network_image_mock: ^2.1.1
  #flutter_launcher_icons: "^0.7.3"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  fonts:
    - family: MyFlutterApp
      fonts:
        - asset: fonts/MyFlutterApp.ttf
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  # The following line enables automatic generation of localization files
  generate: true

  assets:
    - assets/

# Generate new app icons command: flutter pub run flutter_launcher_icons:main
flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
