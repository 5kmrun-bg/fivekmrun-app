
plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android plugin.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    compileSdk 36
    ndkVersion = flutter.ndkVersion

    lint {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "bg.fivekmpark.fivekmrun"
        namespace = "bg.fivekmpark.fivekmrun"
        minSdk 26
        targetSdk 36

        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    // Release builds are signed outside Gradle: the CI workflow runs jarsigner
    // over the built .aab/.apk with the keystore from repository secrets, so
    // there is deliberately no release signingConfig here.
    //
    // Consequence for local work: release artifacts come out UNSIGNED. They
    // cannot be installed directly -- `flutter run --release` and `adb install`
    // both fail with INSTALL_PARSE_FAILED_NO_CERTIFICATES. To try a release
    // build on a device or emulator, sign it with the debug key first:
    //
    //   apksigner sign --ks ~/.android/debug.keystore --ks-pass pass:android \
    //     --key-pass pass:android --ks-key-alias androiddebugkey app-release.apk
    //
    // Do not add a debug-keyed release signingConfig to make this easier: CI
    // signs the artifact it is given, and a pre-signed one risks a debug key
    // reaching the stores.
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = '../..'
}

dependencies {
    implementation 'com.google.android.gms:play-services-pay:16.0.3'
}
