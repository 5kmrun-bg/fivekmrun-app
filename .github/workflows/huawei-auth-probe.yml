# Diagnoses the Huawei AppGallery Connect credentials WITHOUT building the app.
#
# upload-huawei.yml spends ~9 minutes on a Flutter build before it ever touches
# the AppGallery Connect API, which makes iterating on a console permission
# problem painfully slow. This job runs in well under a minute and probes several
# endpoints of increasing privilege, so one run says which prerequisite is missing.
#
# It deliberately never fails the job — read the step output.
name: Huawei AppGallery auth probe
on:
  workflow_dispatch:
    inputs:
      reveal_ids:
        description: >-
          Print a partial fingerprint (first 4 + last 4 chars) of HUAWEI_CLIENT_ID
          and HUAWEI_APP_ID so they can be compared against the AGC console.
          GitHub only masks exact secret matches, so this bypasses masking and the
          fragments persist in the run log. Identifiers only - never the secret.
        type: boolean
        default: false

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Probe AppGallery Connect credentials
        env:
          HUAWEI_CLIENT_ID: ${{ secrets.HUAWEI_CLIENT_ID }}
          HUAWEI_CLIENT_SECRET: ${{ secrets.HUAWEI_CLIENT_SECRET }}
          HUAWEI_APP_ID: ${{ secrets.HUAWEI_APP_ID }}
          HUAWEI_PACKAGE_NAME: bg.fivekmpark.fivekmrun
          HUAWEI_REVEAL_IDS: ${{ inputs.reveal_ids }}
        run: |
          pip3 install requests --quiet
          python3 .github/scripts/huawei_auth_probe.py
