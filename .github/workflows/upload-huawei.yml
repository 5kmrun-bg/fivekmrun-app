# Builds, signs, uploads and SUBMITS the APK to Huawei AppGallery. A successful
# run ends with the build in Huawei's review queue — no console interaction.
#
# AppGallery Connect console prerequisite (one-time, cannot be done from CI):
#   The API client MUST be team-level. Users and permissions -> API key ->
#   Connect API -> Create, with **Project = N/A**.
#   A project-scoped client (JSON: "type": "project_client_id") authenticates
#   fine and is then refused by every publishing endpoint with 403
#   "client token authorization fail.", whatever role it holds — publishing is an
#   account-level resource. A correct client says "type": "team_client_id".
#   This cost ten failed runs; check the client TYPE before suspecting anything else.
#
# All HUAWEI_* secrets live in the `production` environment, not at repo level,
# so this job must keep `environment: production`.
name: Build and Upload to Huawei AppGallery
on: workflow_dispatch
env:
  FLUTTER_VERSION: "${{ vars.FLUTTER_VERSION }}"

jobs:
  android-build:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          architecture: x64
          cache: true
      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('fivekmrun_app_flutter/pubspec.lock') }}
          restore-keys: pub-
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('fivekmrun_app_flutter/android/build.gradle', 'fivekmrun_app_flutter/android/app/build.gradle') }}
          restore-keys: gradle-

      - run: cd fivekmrun_app_flutter && flutter pub get
      - shell: bash
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_SECRET: ${{ secrets.STRAVA_SECRET }}
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
        run: |
          mkdir ./fivekmrun_app_flutter/lib/private && cat << EOF > ./fivekmrun_app_flutter/lib/private/secrets.dart
          const stravaSecret = '$STRAVA_SECRET';
          const stravaClientId = '$STRAVA_CLIENT_ID';
          const googleMapsKey = '$GOOGLE_MAPS_KEY'; 
          EOF

      - name: Replace Firebase config
        run: rm ./fivekmrun_app_flutter/android/app/google-services.json && echo "${{ secrets.FIREBASE_CONFIG }}" | base64 --decode > ./fivekmrun_app_flutter/android/app/google-services.json

      - name: Build APK
        run: cd fivekmrun_app_flutter && flutter build apk --release --no-shrink --dart-define=STORE=huawei

      - name: Sign APK
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > /tmp/keystore.jks
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore /tmp/keystore.jks -storepass '${{ secrets.KEYSTORE_PASSWORD }}' -keypass '${{ secrets.KEYSTORE_PASSWORD }}' ./fivekmrun_app_flutter/build/app/outputs/flutter-apk/app-release.apk ${{ secrets.KEYSTORE_ALIAS }}

      - name: Publish Android Artefacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: ./fivekmrun_app_flutter/build/app/outputs/flutter-apk/

      - name: Upload and submit to Huawei AppGallery
        env:
          HUAWEI_CLIENT_ID: ${{ secrets.HUAWEI_CLIENT_ID }}
          HUAWEI_CLIENT_SECRET: ${{ secrets.HUAWEI_CLIENT_SECRET }}
          HUAWEI_APP_ID: ${{ secrets.HUAWEI_APP_ID }}
          HUAWEI_APK_PATH: ./fivekmrun_app_flutter/build/app/outputs/flutter-apk/app-release.apk
        run: |
          pip3 install requests --quiet
          export HUAWEI_APP_VERSION="$(grep '^version:' fivekmrun_app_flutter/pubspec.yaml | awk '{print $2}')"
          python3 .github/scripts/huawei_publish.py
